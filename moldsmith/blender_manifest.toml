schema_version = "1.0.0"

id = "moldsmith"
version = "0.3.0"
name = "Moldsmith"
tagline = "Silicone mold generator: block molds and vessel molds"
maintainer = "Bohdan Shaparenko <shaparenko.bogdan@gmail.com>"
type = "add-on"

blender_version_min = "4.5.0"

license = ["SPDX:GPL-3.0-or-later"]

tags = ["Modeling", "Mesh"]

[permissions]
files = "Export mold parts as STL files"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
]
